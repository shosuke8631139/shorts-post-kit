<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投稿ツール</title>
<style>
:root{
  --bg:#f6f3ec; --panel:#fffdf8; --ink:#1f1c18; --sub:#6b645a; --line:#e3ddd1;
  --accent:#b8412c; --accent-soft:#f6e3dc; --ok:#2f7a4f; --ok-soft:#dff0e5;
  --yt:#c4302b; --ig:#b03a8c; --tt:#111;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16140f; --panel:#201d17; --ink:#efe9de; --sub:#a59d90; --line:#352f26;
    --accent:#e0705a; --accent-soft:#3a231c; --ok:#6cc08f; --ok-soft:#1d3326; --tt:#eee; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Yu Gothic UI","Hiragino Sans",sans-serif;font-size:15px;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 20px}
.top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:20px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;letter-spacing:.06em}
.count{color:var(--sub);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search]{flex:1;min-width:160px;max-width:280px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:20px;padding:20px;max-width:1500px;margin:0 auto}
@media (max-width:980px){main{grid-template-columns:1fr}#detail{position:static!important;max-height:none!important}}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--sub)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.thumb{aspect-ratio:9/16;background:#000 center/cover no-repeat;position:relative}
.ser{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 7px;border-radius:4px}
.done-all{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;letter-spacing:.1em}
.meta{padding:8px 9px 9px}
.meta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;margin-top:5px}
.dot{font-size:10px;padding:0 5px;border-radius:3px;border:1px solid var(--line);color:var(--sub)}
.dot.on{color:#fff;border-color:transparent}
.rec{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.pill{font-size:10px;padding:0 6px;border-radius:999px;line-height:17px;border:1px solid var(--line);color:var(--sub)}
.pill.published{background:var(--ok);border-color:var(--ok);color:#fff}
.pill.scheduled{border-color:#c9921c;color:#a8760c;background:#fbf1d8}
@media (prefers-color-scheme: dark){.pill.scheduled{background:#3a2e12;color:#e9b84a}}
.snsbox{margin:4px 0 2px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.snsbox h3{margin:0 0 6px;font-size:13px;color:var(--sub)}
.snsrow{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:3px 0}
.snsrow b{min-width:72px}
.snsrow a{color:var(--accent)}
.snsrow small{color:var(--sub)}
.dot.yt.on{background:var(--yt)}.dot.ig.on{background:var(--ig)}.dot.tt.on{background:var(--tt);color:var(--bg)}
#detail{position:sticky;top:110px;align-self:start;max-height:calc(100vh - 130px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
#detail h2{margin:0 0 2px;font-size:22px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
.sub{color:var(--sub);font-size:13px}
.vwrap{display:flex;gap:14px;margin:14px 0}
video{width:150px;aspect-ratio:9/16;background:#000;border-radius:8px;flex:none}
.side{display:flex;flex-direction:column;gap:8px;font-size:13px}
.side a{color:var(--accent)}
.post{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.post input{accent-color:var(--ok);width:16px;height:16px}
.post.on{background:var(--ok-soft);border-color:var(--ok)}
.tabs{display:flex;gap:4px;margin-top:6px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--sub);padding:8px 12px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--accent);font-weight:700}
.block{margin-top:14px}
.block-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.block-h span{font-size:13px;color:var(--sub);font-weight:700}
.n{font-weight:400;margin-left:6px}
.n.over{color:var(--accent);font-weight:700}
textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 10px;font:inherit;font-size:14px;resize:vertical}
.copy{border:0;background:var(--accent);color:#fff;border-radius:6px;padding:5px 14px;font-size:13px;cursor:pointer;font-weight:700}
.copy.done{background:var(--ok)}
.reset{border:0;background:none;color:var(--sub);font-size:12px;cursor:pointer;text-decoration:underline;margin-top:10px}
.hint{font-size:12px;color:var(--sub);margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.empty{color:var(--sub);padding:40px 0;text-align:center;grid-column:1/-1}
.dl{display:inline-block;text-align:center;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:7px 10px;font-weight:700;text-decoration:none;background:none;font:inherit;font-size:13px;cursor:pointer}
.dl.main{background:var(--accent);color:#fff}
.back{display:none;border:0;background:none;color:var(--accent);font:inherit;font-size:14px;padding:0 0 8px;cursor:pointer}
@media (max-width:980px){
  header{padding:10px 14px;position:static}
  main{padding:14px;gap:14px}
  #grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .meta b{font-size:13px}
  .back{display:block}
  .vwrap{flex-direction:column}
  video{width:100%;max-width:320px;margin:0 auto}
  .side{flex-direction:row;flex-wrap:wrap}
  .side>*{flex:1 1 140px}
  input[type=search]{max-width:none}
}
</style>
</head>

<main>

const PLAT = [["yt","YouTube"],["ig","Instagram"],["tt","TikTok"]];
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k);}catch(e){} }
};
let posted = store.get("posted",{});
let filter = store.get("filter","all"), statusF = store.get("statusF","all"), sel = null, tab = "yt";

const series = [["all","すべて"],...[...new Map(DATA.map(d=>[d.series,d.seriesLabel]))]];
const bar = document.getElementById("bar"), q = document.getElementById("q");
series.forEach(([k,l])=>{ const b=document.createElement("button"); b.className="chip"; b.dataset.s=k; b.textContent=l; b.onclick=()=>{filter=k;store.set("filter",k);render();}; bar.insertBefore(b,q); });
[["all","全部"],["todo","未投稿あり"],["done","投稿済み"],["igu","IG 未確認"],["xu","X 未確認"]].forEach(([k,l])=>{ const b=document.createElement("button"); b.className="chip st"; b.dataset.st=k; b.textContent=l; b.onclick=()=>{statusF=k;store.set("statusF",k);render();}; bar.appendChild(b); });
q.oninput = render;

const isPosted=(id,p)=>!!(posted[id]&&posted[id][p]);
const allPosted=id=>PLAT.every(([p])=>isPosted(id,p));
const snsSt=(d,p)=>(d.sns&&d.sns[p]&&d.sns[p].status)||"unknown";
const SNSL={ig:"IG",x:"X"}, STL={published:"投稿済み",scheduled:"予約済み",unknown:"未確認"};
const pills=d=>`<div class="rec">${["ig","x"].map(p=>`<span class="pill ${snsSt(d,p)}" title="記録: ${STL[snsSt(d,p)]}">${SNSL[p]} ${snsSt(d,p)==="published"?"済":snsSt(d,p)==="scheduled"?"予約":"未確認"}</span>`).join("")}</div>`;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  document.querySelectorAll(".chip[data-s]").forEach(b=>b.classList.toggle("on",b.dataset.s===filter));
  document.querySelectorAll(".chip.st").forEach(b=>b.classList.toggle("on",b.dataset.st===statusF));
  const kw=q.value.trim();
  const list=DATA.filter(d=>(filter==="all"||d.series===filter)
    &&(!kw||(d.title+d.headline+d.id).includes(kw))
    &&(statusF==="all"||(statusF==="igu"?snsSt(d,"ig")==="unknown":statusF==="xu"?snsSt(d,"x")==="unknown":statusF==="done"?allPosted(d.id):!allPosted(d.id))));
  const done=DATA.filter(d=>allPosted(d.id)).length;
  document.getElementById("count").textContent=`${DATA.length}本 ・ 全部投稿済み ${done}本`;
  const g=document.getElementById("grid");
  g.innerHTML=list.length?"":(DATA.length?'<p class="empty">該当する動画がありません</p>'
    :'<p class="empty">これは元になるひな形です。<br>meito-reels\\output\\投稿ツール.html を開いてください。</p>');
  list.forEach(d=>{
    const c=document.createElement("div"); c.className="card"+(sel===d.id?" sel":"");
    c.innerHTML=`<div class="thumb" style="background-image:url('${d.thumb}')"><span class="ser">${esc(d.seriesLabel)}</span>${allPosted(d.id)?'<div class="done-all">投稿済み</div>':""}</div>
      <div class="meta"><b>${esc(d.title)}</b><div class="dots">${PLAT.map(([p,l])=>`<span class="dot ${p}${isPosted(d.id,p)?" on":""}">${l==="Instagram"?"IG":l==="YouTube"?"YT":"TT"}</span>`).join("")}</div>${pills(d)}</div>`;
    c.onclick=()=>{sel=d.id;render();showDetail();
      if(matchMedia("(max-width:980px)").matches) document.getElementById("detail").scrollIntoView({behavior:"smooth"});};
    g.appendChild(c);
  });
}

const textKey=(id,f)=>`txt:${id}:${f}`;
const getText=(d,f)=>store.get(textKey(d.id,f),d[f]);

function block(d,f,label,rows,limit){
  const v=getText(d,f);
  return `<div class="block"><div class="block-h"><span>${label}<span class="n" data-n="${f}" data-lim="${limit||""}"></span></span><button class="copy" data-f="${f}">コピー</button></div>
    <textarea data-f="${f}" rows="${rows}">${esc(v)}</textarea></div>`;
}

function showDetail(){
  const d=DATA.find(x=>x.id===sel); if(!d) return;
  const el=document.getElementById("detail");
  let body="";
  if(tab==="yt") body=block(d,"ytTitle","タイトル",2,100)+block(d,"ytDesc","説明文",12);
  else body=block(d,"sns",tab==="ig"?"キャプション":"説明文",11,tab==="ig"?2200:2200)
    +`<p class="hint">${tab==="ig"?"Instagram はリールとして投稿。ハッシュタグは最後に入っています。":"TikTok はそのまま貼り付けでOK。長い場合は箇条書きを削ってください。"}</p>`;
  el.innerHTML=`<button class="back">← 一覧に戻る</button><div class="sub">${esc(d.seriesLabel)}${d.designation&&d.series!=="coin"?" ・ "+esc(d.designation):""}</div><h2>${esc(d.title)}</h2>
    <div class="vwrap"><video src="${d.video}" controls playsinline preload="none" poster="${d.thumb}"></video>
      <div class="side">
        ${PLAT.map(([p,l])=>`<label class="post${isPosted(d.id,p)?" on":""}"><input type="checkbox" data-p="${p}"${isPosted(d.id,p)?" checked":""}>${l} 投稿済み</label>`).join("")}
        <a class="dl main" href="${d.video}" download="${d.id}.mp4">動画をダウンロード</a>
        <button class="dl" id="txtdl">投稿文を保存（.txt）</button>
        ${d.doc?`<a href="${d.doc}" target="_blank">台本と出典を見る</a>`:""}
      </div></div>
    <div class="snsbox"><h3>SNS の投稿記録（照合済みのものだけ）</h3>${[["ig","Instagram"],["x","X"]].map(([p,l])=>{const v=(d.sns&&d.sns[p])||{status:"unknown"};
      return `<div class="snsrow"><b>${l}</b><span class="pill ${v.status}">${STL[v.status]}</span>${v.url?`<a href="${esc(v.url)}" target="_blank" rel="noopener">投稿を開く</a>`:""}${v.at?`<small>予約 ${esc(v.at.replace("T"," ").slice(0,16))}</small>`:""}${v.note?`<small>${esc(v.note)}</small>`:""}</div>`;}).join("")}</div>
    <div class="tabs">${PLAT.map(([p,l])=>`<button class="tab${tab===p?" on":""}" data-t="${p}">${l}</button>`).join("")}</div>
    ${body}
    <button class="reset">文章を最初の状態に戻す</button>`;
  el.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.t;showDetail();});
  el.querySelectorAll(".post input").forEach(cb=>cb.onchange=()=>{
    posted[d.id]=posted[d.id]||{}; posted[d.id][cb.dataset.p]=cb.checked; store.set("posted",posted);
    cb.parentElement.classList.toggle("on",cb.checked); render();
  });
  el.querySelectorAll("textarea").forEach(t=>{ t.oninput=()=>{store.set(textKey(d.id,t.dataset.f),t.value);counts();}; });
  el.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{
    const t=el.querySelector(`textarea[data-f="${b.dataset.f}"]`);
    try{ await navigator.clipboard.writeText(t.value);}catch(e){ t.select(); document.execCommand("copy"); }
    b.textContent="コピーしました"; b.classList.add("done"); setTimeout(()=>{b.textContent="コピー";b.classList.remove("done");},1500);
  });
  el.querySelector(".back").onclick=()=>{ document.getElementById("grid").scrollIntoView({behavior:"smooth"}); };
  el.querySelector("#txtdl").onclick=()=>{
    const txt=["【YouTube タイトル】",getText(d,"ytTitle"),"","【YouTube 説明文】",getText(d,"ytDesc"),"","【Instagram・TikTok】",getText(d,"sns"),""].join(String.fromCharCode(10));
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([String.fromCharCode(0xFEFF)+txt],{type:"text/plain;charset=utf-8"}));
    a.download=`${d.id}_投稿文.txt`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  };
  el.querySelector(".reset").onclick=()=>{ ["ytTitle","ytDesc","sns"].forEach(f=>store.del(textKey(d.id,f))); showDetail(); };
  counts();
}
function counts(){
  document.querySelectorAll("[data-n]").forEach(n=>{
    const t=document.querySelector(`textarea[data-f="${n.dataset.n}"]`); if(!t) return;
    const len=[...t.value].length, lim=+n.dataset.lim;
    n.textContent=lim?`${len} / ${lim}文字`:`${len}文字`; n.classList.toggle("over",lim&&len>lim);
  });
}
render();
if(DATA.length){ sel=DATA[0].id; render(); showDetail(); }
</script>
